[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hydra-harness"
version = "0.1.0"
description = "Local, human-guided TDD workflows for Hydra"
requires-python = ">=3.13,<3.14"
dependencies = [
  "langgraph==1.2.16",
  "langgraph-checkpoint-sqlite>=3,<4",
  "pydantic>=2.12,<3",
]

[project.scripts]
hydra-harness = "hydra_harness.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
