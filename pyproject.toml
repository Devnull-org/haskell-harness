[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lambda-harness"
version = "0.1.0"
description = "Lambda Harness: local agents for functional programming"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "langgraph==1.2.16",
  "langgraph-checkpoint-sqlite>=3,<4",
  "pydantic>=2.12,<3",
  "segno>=1.6,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.hatch.build.targets.wheel.force-include]
"agents" = "lambda_harness/agents"
